name: Python Django app API Test

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-api-tests:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: github-actions-test-secret
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_DEBUG: "False"

      POSTGRES_DB: auto_laboratory
      POSTGRES_USER: auto_laboratory_user
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: auto_laboratory
          POSTGRES_USER: auto_laboratory_user
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U auto_laboratory_user -d auto_laboratory"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django API tests
        run: pytest -q django_tests
