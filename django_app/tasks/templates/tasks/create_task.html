{% extends "base.html" %}

{% block title %}Create Task{% endblock %}

{% block content %}

<section class="form-page">
    <div class="form-panel">
        <h1>Create Task</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit">Create Task</button>

                <a href="{% url 'task_list' %}" class="button-link button-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</section>

{% endblock %}
