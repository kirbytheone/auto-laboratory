{% extends "base.html" %}

{% block title %}Delete Task{% endblock %}

{% block content %}

<section class="form-page">
    <div class="form-panel delete-panel">
        <h1>Delete Task</h1>

        <p>
            Are you sure you want to delete
            <strong>{{ task.title }}</strong>?
        </p>

        <p>This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-actions">
                <button type="submit" class="button-danger">
                    Delete Task
                </button>

                <a
                    href="{% url 'task_detail' task.pk %}"
                    class="button-link button-secondary"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
</section>

{% endblock %}
