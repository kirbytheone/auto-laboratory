{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block content %}

<section class="form-page">
    <div class="form-panel">
        <h1>Edit Task</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit">Save Changes</button>

                <a
                    href="{% url 'task_detail' task.pk %}"
                    class="button-link button-secondary"
                >
                    Cancel
                </a>
            </div>
        </form>
    </div>
</section>

{% endblock %}
