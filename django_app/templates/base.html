<!DOCTYPE html>
<html lang="en">

<head>

    {% load static %}

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Auto Laboratory
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'css/styles.css' %}">

</head>


<body>


<header>
    <nav class="navbar">

        <div class="nav-left">
            <a href="{% url 'task_list' %}">
                Auto Laboratory
            </a>

            {% if user.is_authenticated %}
                <a href="{% url 'create_task' %}">
                    Create Task
                </a>
            {% endif %}
        </div>


        <div class="nav-right">

            {% if user.is_authenticated %}

                <span>
                    {{ user.username }}
                </span>


                <form
                    method="post"
                    action="{% url 'logout' %}"
                >
                    {% csrf_token %}

                    <button type="submit">
                        Logout
                    </button>

                </form>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </nav>
</header>


<hr>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


</body>

</html>
